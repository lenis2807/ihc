<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="../../css/styles.css">

  <script src="../../js/room-store.js" defer></script>
  <script src="../../js/events.js" defer></script>
</head>
<body class="visits-page" data-page="visits">
  <header class="site-header member-header">
    <div class="site-header__inner">
      <a class="site-logo" href="../account/home.html" aria-label="ShareRoom, ir al inicio">
        <span class="site-logo__symbol" aria-hidden="true">SR</span><span>ShareRoom</span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="../account/home.html">Inicio</a>
        <a href="search.html">Habitaciones</a>
        <a href="../account/favorites.html">Favoritos</a>
        <a href="../account/notifications.html">Notificaciones</a>
      </nav>
      <div class="member-header__actions">
        <a class="member-header__icon" href="../account/favorites.html" aria-label="Favoritos">♡</a>

        <img src="../../img/icons/notificaciones.svg" alt="">
